<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    <style>
        /* CSS Tokens for Surface Elevation */
        .elevation {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Adjust Background Gradients/Glow/Scanlines Opacity */
        .background {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.1));
        }

        /* Improve Section Spacing and Card Depth */
        .section {
            padding: 2rem;
        }
        .card {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
        }

        /* Focus-visible Styles */
        :focus-visible {
            outline: 2px solid blue;
        }

        /* Cursor Fallback for Touch Devices */
        @media (hover: none) {
            .button {
                cursor: pointer;
            }
        }

        /* Hamburger Menu Styles */
        .hamburger {
            display: none;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }
            .nav-links {
                display: none;
            }
            .nav-active .nav-links {
                display: block;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="hamburger" onclick="toggleNav()">☰</div>
        <nav class="nav-links">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="section">
            <div class="card elevation">
                <h2>Welcome to My Page</h2>
            </div>
        </section>
    </main>
    <script>
        function toggleNav() {
            document.body.classList.toggle('nav-active');
        }
    </script>
</body>
</html>
